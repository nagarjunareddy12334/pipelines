
name: Node.js CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Step 3: Install Dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Run Lint
      - name: Run Lint
        run: npm run lint

      # Step 5: Run Tests
      - name: Run Unit Tests
        run: npm test

      # Step 6: Build
      - name: Build Application
        run: npm run build

      # Step 7: Upload Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-build
          path: dist/
          retention-days: 7
