name : Artifact Management Pipeline
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  artifact-management:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Create a sample artifact
      - name: Create a sample artifact
        run: |
          echo "This is a sample artifact." > sample-artifact.txt

      # Step 3: Upload the artifact
      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-artifact
          path: sample-artifact.txt
      # Step 4: Download the artifact
      - name: Download the artifact
        uses: actions/download-artifact@v4
        with:
          name: sample-artifact