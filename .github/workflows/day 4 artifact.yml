name: Artifact Management Pipeline

on:
  
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install dependencies
      - name: Install Dependencies
        working-directory: Day 3
        run: npm install

      # Step 4: Run tests
      - name: Run Tests
        working-directory: Day 3
        run: npm test

      # Step 5: Build application
      - name: Build Application
        working-directory: Day 3
        run: npm run build

      # Step 6: Verify build files
      - name: Display Build Files
        working-directory: Day 3
        run: |
          echo "Build artifact content:"
          ls -la dist/

      # Step 7: Upload artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-build
          path: Day 3/dist/
          if-no-files-found: error
          retention-days: 7

  download:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Step 8: Download artifact
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: nodejs-build
          path: downloaded-build/

      # Step 9: Verify downloaded artifact
      - name: Verify Artifact
        run: |
          echo "Downloaded artifact files:"
          ls -la downloaded-build/

      # Step 10: Display application content
      - name: Display Build Content
        run: cat downloaded-build/app.js

      # Step 11: Deployment simulation
      - name: Deploy Artifact
        run: |
          echo "Deploying Node.js build artifact..."
          ls -la downloaded-build/
          echo "Deployment completed successfully."